[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "headbop-ai"
version = "0.1.0"
description = "Local music-driven image animation with a faithful MP4 preview"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pillow>=11,<13", "numpy>=2,<3", "librosa>=0.11,<0.12",
  "soundfile>=0.13,<0.14", "opencv-python-headless>=4.11,<5", "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "playwright>=1.51,<2"]

[tool.setuptools.packages.find]
include = ["headbop*"]

[tool.setuptools.package-data]
headbop = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
