# Single-host deployment with private automatic guest sessions; see docs/PRODUCTION.md.
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      HEADBOP_DATA_DIR: /data
      HEADBOP_ENV: production
      HEADBOP_PUBLIC_ORIGIN: https://${HEADBOP_DOMAIN:?Set the public domain}
      HEADBOP_TTL_HOURS: "24"
      HEADBOP_MAX_PROJECTS: "30"
      HEADBOP_USER_MAX_PROJECTS: "10"
      HEADBOP_MAX_STORAGE_MIB: "2048"
      HEADBOP_USER_STORAGE_MIB: "256"
      HEADBOP_RENDER_TIMEOUT_SECONDS: "300"
      HEADBOP_MAX_VIDEO_MIB: "64"
    # The backend port is private. Only Caddy may set forwarded client addresses.
    command: ["uvicorn", "headbop.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--forwarded-allow-ips", "*"]
    volumes:
      - headbop_data:/data
    expose:
      - "8000"
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      HEADBOP_DOMAIN: ${HEADBOP_DOMAIN:?Set the public domain}
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  headbop_data:
  caddy_data:
  caddy_config:
